<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>No Distraction Tool</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <img class="mark" src="icons/icon-128.png" alt="" width="64" height="64">
      <h1>No Distraction Tool</h1>
      <p id="status" class="status">Non attivo</p>
      <p id="detail">Quando smetti di guardare lo schermo, i video vanno in pausa.</p>
      <button id="toggle" type="button">Avvia</button>
      <button id="open-monitor" class="secondary" type="button">Apri il monitor</button>
      <small>L’elaborazione avviene sul dispositivo.</small>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
